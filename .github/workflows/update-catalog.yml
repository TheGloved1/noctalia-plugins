name: Update catalog on push

on:
  push:
    branches: [main]
    paths-ignore:
      - catalog.toml
      - '.**'
      - README.md
  workflow_dispatch:

concurrency:
  group: update-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild catalog
        run: python3 .github/workflows/scripts/update-catalog.py
      - name: Check for changes
        id: check
        run: |
          git add catalog.toml
          if git diff --cached --quiet catalog.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore: update plugin catalog [skip ci]"
          git push
