    { value = "Arbok", label_key = "settings.selected_critter.options.Arbok" },
    { value = "Sandslash", label_key = "settings.selected_critter.options.Sandslash" },
    { value = "Ninetales", label_key = "settings.selected_critter.options.Ninetales" },
    { value = "Tauros", label_key = "settings.selected_critter.options.Tauros" }
