id = "gloves/pokedash"
name = "PokeDash"
version = "1.2.1"
plugin_api = 22
author = "gloves"
license = "MIT"
description = "Your favourite Pokemon roaming your desktop"
icon = "pets"
tags = ["desktop", "fun", "pokemon", "widget"]
dependencies = []

[[desktop_widget]]
id = "display"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "selected_critter"
  type = "select"
  label_key = "settings.selected_critter.label"
  description_key = "settings.selected_critter.description"
  default = "Pikachu"
  options = [
    { value = "Pikachu", label_key = "settings.selected_critter.options.Pikachu" },
    { value = "Bulbasaur", label_key = "settings.selected_critter.options.Bulbasaur" },
    { value = "Charmander", label_key = "settings.selected_critter.options.Charmander" },
    { value = "Squirtle", label_key = "settings.selected_critter.options.Squirtle" },
    { value = "Mew", label_key = "settings.selected_critter.options.Mew" },
    { value = "Gengar", label_key = "settings.selected_critter.options.Gengar" },
    { value = "Eevee", label_key = "settings.selected_critter.options.Eevee" },
    { value = "Lucario", label_key = "settings.selected_critter.options.Lucario" },
    { value = "Mimikyu", label_key = "settings.selected_critter.options.Mimikyu" },
    { value = "Snorlax", label_key = "settings.selected_critter.options.Snorlax" },
    { value = "Lugia", label_key = "settings.selected_critter.options.Lugia" },
    { value = "Moltres", label_key = "settings.selected_critter.options.Moltres" },
    { value = "Zapdos", label_key = "settings.selected_critter.options.Zapdos" },
    { value = "Articuno", label_key = "settings.selected_critter.options.Articuno" },
    { value = "Cyndaquil", label_key = "settings.selected_critter.options.Cyndaquil" },
    { value = "Dragonite", label_key = "settings.selected_critter.options.Dragonite" },
    { value = "Vulpix", label_key = "settings.selected_critter.options.Vulpix" },
    { value = "Abra", label_key = "settings.selected_critter.options.Abra" },
    { value = "Jigglypuff", label_key = "settings.selected_critter.options.Jigglypuff" },
    { value = "Psyduck", label_key = "settings.selected_critter.options.Psyduck" },
    { value = "Meowth", label_key = "settings.selected_critter.options.Meowth" },
    { value = "Ditto", label_key = "settings.selected_critter.options.Ditto" },
    { value = "Cubone", label_key = "settings.selected_critter.options.Cubone" },
    { value = "Bellsprout", label_key = "settings.selected_critter.options.Bellsprout" },
    { value = "Zoobat", label_key = "settings.selected_critter.options.Zoobat" },
    { value = "Arcanine", label_key = "settings.selected_critter.options.Arcanine" },
    { value = "Exeggutor", label_key = "settings.selected_critter.options.Exeggutor" },
    { value = "Machamp", label_key = "settings.selected_critter.options.Machamp" },
    { value = "Lapras", label_key = "settings.selected_critter.options.Lapras" },
    { value = "Aerodactyl", label_key = "settings.selected_critter.options.Aerodactyl" },
    { value = "Cloyster", label_key = "settings.selected_critter.options.Cloyster" },
    { value = "Gastly", label_key = "settings.selected_critter.options.Gastly" },
    { value = "Haunter", label_key = "settings.selected_critter.options.Haunter" },
    { value = "Scyther", label_key = "settings.selected_critter.options.Scyther" },
