  [[desktop_widget.setting]]
  key = "sprite_style"
  type = "select"
  label_key = "settings.sprite_style.label"
  description_key = "settings.sprite_style.description"
  default = "normal"
  options = [
    { value = "normal", label_key = "settings.sprite_style.options.normal" },
    { value = "showdown", label_key = "settings.sprite_style.options.showdown" }
  ]

  [[desktop_widget.setting]]
  key = "background_style"
  type = "select"
  label_key = "settings.background_style.label"
  description_key = "settings.background_style.description"
  default = "transparent"
  options = [
    { value = "transparent", label_key = "settings.background_style.options.transparent" },
    { value = "dms", label_key = "settings.background_style.options.dms" },
    { value = "glass", label_key = "settings.background_style.options.glass" }
  ]

  [[desktop_widget.setting]]
  key = "sprite_scale"
  type = "int"
  label_key = "settings.sprite_scale.label"
  description_key = "settings.sprite_scale.description"
  default = 100
  min = 50
  max = 250

  [[desktop_widget.setting]]
  key = "overview_mode"
  type = "select"
  label_key = "settings.overview_mode.label"
  description_key = "settings.overview_mode.description"
  default = "always"
  options = [
    { value = "always", label_key = "settings.overview_mode.options.always" },
    { value = "overview_only", label_key = "settings.overview_mode.options.overview_only" },
    { value = "hidden_in_overview", label_key = "settings.overview_mode.options.hidden_in_overview" }
  ]

[[service]]
id = "overview"
entry = "overview.luau"

[[panel]]
id = "overview-widget"
entry = "panel.luau"
width = 120
height = 120
placement = "floating"
